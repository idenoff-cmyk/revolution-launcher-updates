name: Windows checks and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.1.1 pyinstaller==6.22.2
      - run: python -m pytest -q
      - run: python -m PyInstaller Revolution.spec --noconfirm
        if: github.event_name == 'workflow_dispatch'
      - name: Copy deployment configuration
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Copy-Item -LiteralPath community.json -Destination dist/Revolution/community.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Revolution-Windows-app
          path: dist/Revolution/
          retention-days: 14
